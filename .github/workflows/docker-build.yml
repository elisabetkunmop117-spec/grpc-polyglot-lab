name: Build Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Go server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-grpc-go-server:latest

      - name: Build Node client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node-client/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-grpc-node-client:latest

      - name: Build Python client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python-client/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-grpc-python-client:latest

