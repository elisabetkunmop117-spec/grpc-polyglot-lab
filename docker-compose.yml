services:
  go-server:
    image: ghcr.io/elisabetkunmop117-spec/grpc-polyglot-lab-grpc-go-server:latest
    ports:
      - "50051:50051"
    networks:
      - grpc-network

  node-client:
    image: ghcr.io/elisabetkunmop117-spec/grpc-polyglot-lab-grpc-node-client:latest
    environment:
      GRPC_SERVER: go-server:50051
    depends_on:
      - go-server
    networks:
      - grpc-network

  python-client:
    image: ghcr.io/elisabetkunmop117-spec/grpc-polyglot-lab-grpc-python-client:latest
    environment:
      GRPC_SERVER: go-server:50051
    depends_on:
      - go-server
    networks:
      - grpc-network

networks:
  grpc-network:
    driver: bridge
