
services:
  go-server:
    image: grpc-go-server
    build:
      context: .
      dockerfile: go-server/Dockerfile
    ports:
      - "50051:50051"
    networks:
      - grpc-network

  node-client:
    image: grpc-node-client
    build:
      context: .
      dockerfile: node-client/Dockerfile
    environment:
      GRPC_SERVER: go-server:50051
    depends_on:
      - go-server
    networks:
      - grpc-network

  python-client:
    image: grpc-python-client
    build:
      context: .
      dockerfile: python-client/Dockerfile
    environment:
      GRPC_SERVER: go-server:50051
    depends_on:
      - go-server
    networks:
      - grpc-network

networks:
  grpc-network:
    driver: bridge
